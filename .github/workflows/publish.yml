name: Publish Python package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.19"
  BUILD_SETUPTOOLS_VERSION: "84.0.0"
  BUILD_WHEEL_VERSION: "0.47.0"

jobs:
  dssp-integration:
    name: Locked DSSP integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create locked Conda environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: conda-lock.yml
          environment-name: cooperbeta-release
          micromamba-version: "2.9.0-0"
          cache-environment: true
          cache-downloads: true
          post-cleanup: all

      - name: Install locked Python graph into the Conda prefix
        shell: micromamba-shell {0}
        run: UV_PROJECT_ENVIRONMENT="${CONDA_PREFIX}" uv sync --locked --extra full --extra dev

      - name: Fetch checksum-pinned experimental structure
        shell: micromamba-shell {0}
        run: |
          structure_path="${RUNNER_TEMP}/1QJ9.cif"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            https://files.rcsb.org/download/1QJ9.cif \
            --output "${structure_path}"
          echo "344425819432d89b3b59869c0b81c55ed46795169218e2ee133f12d3a5597926  ${structure_path}" \
            | sha256sum --check --strict

      - name: Exercise real DSSP and validate provenance
        shell: micromamba-shell {0}
        run: |
          output_dir="${RUNNER_TEMP}/cooperbeta-dssp"
          mkdir -p "${output_dir}"
          cooper-beta \
            "${RUNNER_TEMP}/1QJ9.cif" \
            --workers 1 \
            --prepare-workers 1 \
            --out "${output_dir}/result.csv" \
            runtime.prepare_cache_enabled=false \
            output.summary_limit=0
          python - "${output_dir}/result.csv" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          csv_path = Path(sys.argv[1])
          with csv_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 1
          assert rows[0]["filename"] == "1QJ9.cif"
          assert rows[0]["author_chain_id"] == "A"
          assert rows[0]["result"] == "BARREL"
          manifest = json.loads(Path(f"{csv_path}.manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] == 1
          assert manifest["status"] == "complete"
          assert len(manifest["output_sha256"]) == 64
          assert len(manifest["executables"]["dssp_sha256"]) == 64
          PY

      - name: Verify curated positive examples
        shell: micromamba-shell {0}
        run: |
          example_output="${RUNNER_TEMP}/cooperbeta-examples.csv"
          cooper-beta \
            examples \
            --workers 1 \
            --prepare-workers 1 \
            --out "${example_output}" \
            runtime.prepare_cache_enabled=false \
            output.summary_limit=0
          python - "${example_output}" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          from cooper_beta.evaluation.runner import validate_detector_artifact_manifest
          from cooper_beta.integrity import file_sha256

          csv_path = Path(sys.argv[1]).resolve()
          repository_root = Path.cwd().resolve()
          example_manifest = json.loads(
              (repository_root / "examples" / "manifest.json").read_text(encoding="utf-8")
          )
          expected = {
              entry["file"]: entry for entry in example_manifest["examples"]
          }
          with csv_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert {row["filename"] for row in rows} == set(expected)
          for row in rows:
              entry = expected[row["filename"]]
              assert row["author_chain_id"] == entry["target_author_chain_id"]
              assert row["result"] == entry["expected_result"] == "BARREL"
              assert file_sha256(repository_root / "examples" / entry["file"]) == entry["sha256"]
          validate_detector_artifact_manifest(
              Path(f"{csv_path}.manifest.json"), expected_output=csv_path
          )
          PY

  build:
    name: Validate and build distributions
    needs: dssp-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked build and test environment
        run: uv sync --locked --python 3.12 --extra full --extra dev

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os
          from cooper_beta._version import __version__

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if __version__ != tag:
              raise SystemExit(
                  f"source version {__version__!r} does not match release tag {tag!r}"
              )
          PY

      - name: Run tests
        run: .venv/bin/python -m pytest --cov=cooper_beta --cov-report=term-missing

      - name: Run lint
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
          .venv/bin/python -m mypy

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src external_methods scripts data/scripts tests

      - name: Check source distribution manifest
        run: .venv/bin/python -m check_manifest -v

      - name: Build distributions
        run: |
          build_constraints="${RUNNER_TEMP}/build-constraints.txt"
          printf 'setuptools==%s\nwheel==%s\n' \
            "${BUILD_SETUPTOOLS_VERSION}" \
            "${BUILD_WHEEL_VERSION}" \
            > "${build_constraints}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --build-constraint "${build_constraints}"
          .venv/bin/python -m twine check dist/*

      - name: Clean-install and smoke-test wheel and source distribution
        run: |
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t sdists < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          wheel_path="${wheels[0]}"
          sdist_path="${sdists[0]}"
          for artifact in "${wheel_path}" "${sdist_path}"; do
            environment_path="$(mktemp -d)/venv"
            python -m venv "${environment_path}"
            "${environment_path}/bin/python" -m pip install --disable-pip-version-check "${artifact}[full]"
            "${environment_path}/bin/python" -m pip check
            "${environment_path}/bin/cooper-beta" --version
            "${environment_path}/bin/python" -c "from cooper_beta import build_config; c=build_config(); assert (c.rules.strand_adjacency_count.minimum, c.rules.cycle_strand_count_fraction.minimum_count, c.rules.cycle_strand_count_fraction.minimum_fraction, c.rules.cycle_rank.minimum) == (8, 4, 0.05, 1)"
          done

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest tested distributions
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required by GitHub artifact attestations.
      attestations: write # Required to persist GitHub artifact attestations.

    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Attest distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, attest]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cooper-beta/
    permissions:
      id-token: write # Required for TestPyPI Trusted Publishing.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, attest]
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/cooper-beta/
    permissions:
      id-token: write # Required for PyPI Trusted Publishing.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
