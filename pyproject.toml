[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooper-beta"
dynamic = ["version"]
description = "Beta-barrel-like chain detector for PDB/mmCIF structures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Shuyu Zhong" },
]
keywords = ["bioinformatics", "beta-barrel", "protein-structure", "pdb", "mmcif"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.23,<3",
  "biopython>=1.81,<2",
  "hydra-core>=1.3,<2",
  "threadpoolctl>=3.2,<4",
  "tqdm>=4,<5",
]

[project.optional-dependencies]
eval = [
  "pandas>=1.5,<4",
]
scripts = [
  "pandas>=1.5,<4",
  "matplotlib>=3.7,<4",
  "lxml>=4.9,<7",
]
ml = [
  "pandas>=1.5,<4",
  "scikit-learn>=1.5,<2",
]
full = [
  "pandas>=1.5,<4",
  "matplotlib>=3.7,<4",
  "lxml>=4.9,<7",
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=7,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "mypy>=1.11,<2",
  "build>=1.2,<2",
  "check-manifest>=0.49,<1",
  "twine>=5,<7",
  "pandas>=1.5,<4",
  "matplotlib>=3.7,<4",
  "lxml>=4.9,<7",
  "scikit-learn>=1.5,<2",
]

[project.urls]
Homepage = "https://github.com/GeraltZeroZhong/Cooper-Beta"
Source = "https://github.com/GeraltZeroZhong/Cooper-Beta"
Issues = "https://github.com/GeraltZeroZhong/Cooper-Beta/issues"
Documentation = "https://github.com/GeraltZeroZhong/Cooper-Beta#readme"

[project.scripts]
cooper-beta = "cooper_beta.cli:main"
cooper-beta-eval = "cooper_beta.evaluation.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "cooper_beta._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cooper_beta*"]

[tool.setuptools.package-data]
cooper_beta = ["conf/**/*.yaml", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["cooper_beta"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.mypy]
python_version = "3.12"
files = ["src/cooper_beta", "scripts", "data/scripts", "external_methods"]
strict = true
warn_unreachable = true
show_error_codes = true
untyped_calls_exclude = ["Bio"]

[[tool.mypy.overrides]]
module = [
  "Bio.*",
  "hydra.*",
  "omegaconf.*",
  "pandas.*",
  "sklearn.*",
  "threadpoolctl",
  "tqdm.*",
]
ignore_missing_imports = true

[tool.check-manifest]
ignore = [
  ".github/**",
  ".gitignore",
  "data/external_methods/**",
  "external_methods/**",
  "tests/test_external_isitabarrel.py",
  "tests/test_external_pred_tmbb2.py",
  "tests/test_external_foldseek.py",
]
